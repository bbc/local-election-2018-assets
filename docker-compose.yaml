version: "3"
services:
  salieri:
    restart: always
    build: ./docker/salieri
    volumes:
      - "./:/app"
    ports:
      - "3000:3000"
  component:
    restart: always
    build: ./docker/component
    volumes:
      - "./:/app"
    ports:
      - "8080:8080"
  component-no-reload:
    restart: always
    build: ./docker/component
    volumes:
      - "./:/app"
    ports:
      - "8080:8080"
    command: bash -c "npm run rebuild-if-needed && npm run dev:noreload"
